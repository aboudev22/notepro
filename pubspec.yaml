name: notepro
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.1.1
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_quill: ^6.4.4
  flutter_svg: ^2.0.7

  # Firebase Core
  firebase_core: ^2.24.2

  # Auth
  firebase_auth: ^4.15.3

  # Cloud Firestore
  cloud_firestore: ^4.13.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^13.2.0

  # UI
  flutter_hooks: ^0.20.5

  # Sharing
  share_plus: ^7.2.1

  # Storage
  firebase_storage: ^11.5.6

  # Image handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Local storage
  shared_preferences: ^2.2.2

  # Provider
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/user1.png
    - assets/user2.png
    - assets/user3.png
    - assets/user4.png
    - assets/circle.png
    - assets/hero.png
    - assets/logo.png
